<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FastAPI — Собеседование (вопросник ЕГЭ-стиль)</title>
<style>
  :root{
    --bg:#0f1220; --card:#191d33; --card2:#20264a; --text:#e8ebff;
    --muted:#9aa2c7; --accent:#4f8cff; --ok:#2ecc71; --bad:#ff5468;
    --okbg:#16351f; --badbg:#3a1620; --border:#2b3157;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#0f1220,#141833); color:var(--text);
    min-height:100vh; padding:16px; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px; margin:0 auto;}
  header{margin-bottom:14px;}
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:13px;}
  .bar{height:8px; background:var(--card); border-radius:99px; overflow:hidden; margin:14px 0;}
  .bar > span{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),#7db0ff); transition:width .3s;}
  .meta{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); margin-bottom:10px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px 16px; box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .tag{display:inline-block; font-size:11px; letter-spacing:.4px; text-transform:uppercase; color:var(--accent); background:rgba(79,140,255,.12); padding:3px 8px; border-radius:6px; margin-bottom:10px;}
  .q{font-size:17px; line-height:1.45; margin:0 0 14px; font-weight:600;}
  .opts{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left; padding:13px 14px; border-radius:12px; border:1px solid var(--border);
    background:var(--card2); color:var(--text); font-size:15px; line-height:1.35;
    cursor:pointer; transition:.15s; display:flex; gap:10px; align-items:flex-start;
  }
  .opt:hover:not([disabled]){border-color:var(--accent); transform:translateY(-1px);}
  .opt[disabled]{cursor:default;}
  .opt .k{font-weight:700; color:var(--muted); min-width:18px;}
  .opt.correct{background:var(--okbg); border-color:var(--ok);}
  .opt.wrong{background:var(--badbg); border-color:var(--bad);}
  .expl{margin-top:14px; padding:14px; border-radius:12px; background:#0d1024; border:1px solid var(--border); font-size:14px; line-height:1.5; display:none;}
  .expl.show{display:block; animation:fade .25s ease;}
  .expl h4{margin:0 0 6px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
  .expl code{background:#1b2450; padding:1px 6px; border-radius:5px; font-size:13px; color:#a9c7ff;}
  .expl pre{background:#0a0d1f; border:1px solid var(--border); padding:10px; border-radius:8px; overflow:auto; font-size:12.5px;}
  .verdict{font-weight:700; margin-bottom:6px;}
  .verdict.ok{color:var(--ok);} .verdict.bad{color:var(--bad);}
  .row{display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:10px;}
  button.nav{
    background:var(--accent); color:#fff; border:0; padding:12px 20px; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer; transition:.15s;
  }
  button.nav:hover{filter:brightness(1.08);} button.nav:disabled{opacity:.4; cursor:not-allowed;}
  .score{font-size:14px; color:var(--muted);}
  .result{text-align:center; padding:30px 16px;}
  .result .big{font-size:44px; font-weight:800; margin:8px 0;}
  .result .lbl{color:var(--muted);}
  .grade{font-size:20px; margin:10px 0; font-weight:700;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>FastAPI — тренажёр собеседования</h1>
    <div class="sub">Формат ЕГЭ · выбери один вариант · пояснение сразу после ответа</div>
  </header>

  <div class="bar"><span id="prog"></span></div>
  <div class="meta">
    <span id="counter">Вопрос 1</span>
    <span id="live">Верно: 0</span>
  </div>

  <div id="app" class="card"></div>
</div>

<script>
const QUESTIONS = [
  {
    t:"Основы",
    q:"На каком спецификации построен FastAPI и что обеспечивает асинхронную работу?",
    o:["WSGI — синхронный интерфейс Python-приложений","ASGI — асинхронный интерфейс, FastAPI построен поверх Starlette","CGI-скрипты","Собственный бинарный протокол FastAPI"],
    a:1,
    e:"FastAPI — это ASGI-фреймворк. Он построен поверх <code>Starlette</code> (веб-часть, роутинг, middleware) и <code>Pydantic</code> (валидация данных). ASGI (в отличие от WSGI) поддерживает async/await, WebSocket и долгоживущие соединения."
  },
  {
    t:"Основы",
    q:"Какие две библиотеки составляют фундамент FastAPI?",
    o:["Flask и Jinja2","Django и DRF","Starlette и Pydantic","aiohttp и marshmallow"],
    a:2,
    e:"<code>Starlette</code> отвечает за веб-уровень (роутинг, middleware, ответы), а <code>Pydantic</code> — за валидацию, сериализацию и настройки на основе аннотаций типов."
  },
  {
    t:"Сервер",
    q:"Какой ASGI-сервер чаще всего используют для запуска FastAPI в разработке?",
    o:["Gunicorn сам по себе","Uvicorn","Apache mod_wsgi","Waitress"],
    a:1,
    e:"<code>uvicorn main:app --reload</code> — стандартный способ. Uvicorn — это ASGI-сервер на uvloop/httptools. В продакшене Uvicorn часто запускают как воркеры под управлением Gunicorn."
  },
  {
    t:"Типизация",
    q:"Как FastAPI понимает, что параметр функции — это path-параметр?",
    o:["По декоратору @path","По имени переменной, совпадающему с фигурными скобками в пути","По типу str","Нужно явно указать Path() всегда"],
    a:1,
    e:"Если имя аргумента функции совпадает с <code>{name}</code> в пути (<code>@app.get('/items/{item_id}')</code> → <code>def read(item_id: int)</code>), это path-параметр. Остальные аргументы становятся query-параметрами (для простых типов)."
  },
  {
    t:"Типизация",
    q:"Функция: def read(q: str). Параметр q не в пути. Чем он будет?",
    o:["Path-параметром","Query-параметром","Заголовком","Телом запроса"],
    a:1,
    e:"Простые типы (str, int, bool...), не входящие в путь, по умолчанию трактуются как query-параметры: <code>/items?q=abc</code>. Аргумент без значения по умолчанию будет обязательным."
  },
  {
    t:"Query",
    q:"Как сделать query-параметр необязательным со значением по умолчанию None?",
    o:["q: str = None без аннотаций","q: str | None = None","q: required=False","Query-параметры всегда обязательны"],
    a:1,
    e:"<code>q: str | None = None</code> (или <code>Optional[str] = None</code>) делает параметр необязательным. Наличие значения по умолчанию — ключевой признак необязательности в FastAPI."
  },
  {
    t:"Валидация",
    q:"Чем задать ограничения валидации query-параметра (например, max_length)?",
    o:["Query(max_length=50)","Field(max_length=50) прямо в сигнатуре","validate(...)","Только вручную через if"],
    a:0,
    e:"Для параметров запроса используют <code>Query()</code>: <code>q: str = Query(default=None, max_length=50, min_length=3)</code>. Аналогично есть <code>Path()</code>, <code>Header()</code>, <code>Cookie()</code>. <code>Field()</code> применяется внутри Pydantic-моделей."
  },
  {
    t:"Тело запроса",
    q:"Как FastAPI определяет, что параметр — это тело запроса (request body)?",
    o:["По имени body","Если тип параметра — это Pydantic-модель (BaseModel)","Всегда, если это POST","Нужен декоратор @body"],
    a:1,
    e:"Если аргумент аннотирован Pydantic-моделью (наследник <code>BaseModel</code>), FastAPI читает его из JSON-тела запроса, валидирует и передаёт готовый объект."
  },
  {
    t:"Pydantic",
    q:"Что делает Pydantic BaseModel при получении невалидных данных?",
    o:["Молча приводит типы и продолжает","Поднимает ValidationError, FastAPI отвечает 422","Возвращает None","Игнорирует лишние поля без ошибки всегда"],
    a:1,
    e:"При несоответствии данных схеме Pydantic бросает <code>ValidationError</code>. FastAPI перехватывает её и автоматически возвращает ответ <code>422 Unprocessable Entity</code> с деталями по каждому полю."
  },
  {
    t:"Pydantic",
    q:"Зачем нужен параметр response_model в декораторе пути?",
    o:["Только для документации","Для фильтрации/валидации выходных данных и формирования схемы ответа","Для кэширования","Для авторизации"],
    a:1,
    e:"<code>response_model</code> задаёт схему ответа: FastAPI отфильтрует лишние поля, провалидирует выход и покажет модель в OpenAPI. Полезно, чтобы, например, не отдать пароль из внутренней модели пользователя."
  },
  {
    t:"async",
    q:"Когда обработчик стоит объявлять как async def?",
    o:["Всегда, это быстрее в любом случае","Когда внутри используются await-совместимые (неблокирующие) операции ввода-вывода","Только для GET","async def запрещён в FastAPI"],
    a:1,
    e:"<code>async def</code> уместен, если внутри есть <code>await</code> на асинхронных библиотеках (async БД, httpx и т.д.). Если код блокирующий, используйте обычный <code>def</code> — FastAPI выполнит его в threadpool, не блокируя event loop."
  },
  {
    t:"async",
    q:"Что произойдёт, если внутри async def вызвать блокирующую операцию (например, time.sleep)?",
    o:["Ничего, FastAPI сам вынесет её в поток","Заблокируется event loop и пострадает вся конкурентность","Будет 500 ошибка","Операция выполнится в отдельном процессе"],
    a:1,
    e:"Блокирующий вызов внутри <code>async def</code> блокирует единственный event loop, останавливая обработку других запросов. Для блокирующего кода используйте обычный <code>def</code> либо выносите работу через <code>run_in_threadpool</code>/executor."
  },
  {
    t:"async",
    q:"Как FastAPI обрабатывает обычный (sync) def-обработчик?",
    o:["Отклоняет его","Запускает в отдельном пуле потоков (threadpool)","Блокирует loop","Переписывает в async автоматически"],
    a:1,
    e:"Sync-обработчики выполняются во внешнем threadpool (через anyio), поэтому блокирующий код не останавливает event loop. Это делает безопасным использование обычного <code>def</code> с синхронными библиотеками."
  },
  {
    t:"DI",
    q:"Что делает Depends() в FastAPI?",
    o:["Импортирует модуль","Объявляет зависимость, которую FastAPI вызовет и подставит результат","Создаёт middleware","Логирует запрос"],
    a:1,
    e:"<code>Depends(func)</code> — механизм Dependency Injection: FastAPI вызовет <code>func</code>, разрешит её собственные зависимости и подставит результат в обработчик. Используется для общей логики: БД-сессии, авторизация, параметры."
  },
  {
    t:"DI",
    q:"Как оформить зависимость, которая должна освобождать ресурс после запроса (например, закрыть сессию БД)?",
    o:["return внутри обычной функции","Через yield: код до yield — setup, после — teardown","Использовать global","Это невозможно"],
    a:1,
    e:"Зависимость с <code>yield</code>: код до <code>yield</code> выполняется до обработчика, значение отдаётся, а код после <code>yield</code> (в блоке finally) — уже после ответа. Идеально для <code>db.close()</code>."
  },
  {
    t:"DI",
    q:"Можно ли переопределять зависимости в тестах?",
    o:["Нет","Да, через app.dependency_overrides[...]","Только переписав код","Только через переменные окружения"],
    a:1,
    e:"<code>app.dependency_overrides[real_dep] = fake_dep</code> подменяет зависимость на время тестов — например, реальную БД на тестовую. Это одна из сильных сторон DI-системы FastAPI."
  },
  {
    t:"Статусы",
    q:"Как задать код ответа по умолчанию для успешного создания ресурса?",
    o:["return 201","status_code=201 (или status.HTTP_201_CREATED) в декораторе","raise 201","Никак, всегда 200"],
    a:1,
    e:"<code>@app.post('/items', status_code=status.HTTP_201_CREATED)</code>. Для динамического кода можно использовать параметр <code>response: Response</code> и менять <code>response.status_code</code>."
  },
  {
    t:"Ошибки",
    q:"Как вернуть клиенту ошибку 404 с сообщением?",
    o:["return 404","raise HTTPException(status_code=404, detail='Not found')","throw Error(404)","return {'error':404}"],
    a:1,
    e:"<code>raise HTTPException(status_code=404, detail='Not found')</code>. FastAPI перехватит исключение и вернёт корректный JSON-ответ с нужным статусом. Можно добавить и заголовки через параметр <code>headers</code>."
  },
  {
    t:"Ошибки",
    q:"Как глобально обработать конкретный тип исключения по-своему?",
    o:["try/except в каждом обработчике","@app.exception_handler(MyError) — регистрируем обработчик","Только через middleware","Никак"],
    a:1,
    e:"Декоратор <code>@app.exception_handler(SomeException)</code> регистрирует глобальный обработчик, который вернёт кастомный ответ. Так удобно централизованно преобразовывать доменные исключения в HTTP-ответы."
  },
  {
    t:"Роутинг",
    q:"Как разбить приложение на модули с группами эндпоинтов?",
    o:["Только один файл main.py","APIRouter — отдельные роутеры, подключаемые через app.include_router()","Через Blueprint как во Flask","Через классы-контроллеры обязательно"],
    a:1,
    e:"<code>router = APIRouter(prefix='/users', tags=['users'])</code>, затем <code>app.include_router(router)</code>. Позволяет модульно организовать код, задать общий префикс, теги и зависимости для группы маршрутов."
  },
  {
    t:"Порядок",
    q:"Почему маршрут /users/me нужно объявлять ДО /users/{user_id}?",
    o:["Алфавитный порядок","Маршруты матчатся по порядку объявления; {user_id} перехватит 'me'","Это не имеет значения","Из-за кэша"],
    a:1,
    e:"FastAPI проверяет маршруты в порядке регистрации. Если <code>/users/{user_id}</code> идёт первым, запрос <code>/users/me</code> попадёт в него (user_id='me'). Более специфичные пути объявляйте раньше."
  },
  {
    t:"Middleware",
    q:"Что такое middleware в FastAPI/Starlette?",
    o:["Модель данных","Функция, оборачивающая каждый запрос/ответ (до и после обработчика)","Тип зависимости","Формат логов"],
    a:1,
    e:"Middleware выполняется для каждого запроса: получает <code>request</code>, вызывает <code>call_next</code> и может изменить ответ. Используется для CORS, логирования, замера времени, добавления заголовков."
  },
  {
    t:"CORS",
    q:"Как разрешить запросы с другого домена (браузерный фронтенд)?",
    o:["Ничего не нужно, CORS включён по умолчанию","Добавить CORSMiddleware с нужными origins","Отключить HTTPS","Через response_model"],
    a:1,
    e:"<code>app.add_middleware(CORSMiddleware, allow_origins=[...], allow_methods=[...], allow_headers=[...])</code>. Без этого браузер заблокирует кросс-доменные запросы политикой Same-Origin."
  },
  {
    t:"Фоновые задачи",
    q:"Как выполнить лёгкую работу после отправки ответа (например, отправить письмо)?",
    o:["time.sleep в обработчике","BackgroundTasks: tasks.add_task(func, ...)","Отдельный поток вручную всегда","Никак в рамках запроса"],
    a:1,
    e:"Параметр <code>background_tasks: BackgroundTasks</code> и <code>background_tasks.add_task(send_email, ...)</code>. Задача запустится после возврата ответа. Для тяжёлых/надёжных задач лучше Celery/очереди."
  },
  {
    t:"Жизненный цикл",
    q:"Современный способ выполнить код при старте и остановке приложения?",
    o:["@app.on_event('startup') — единственный вариант","lifespan-контекстменеджер, передаваемый в FastAPI(lifespan=...)","__init__ приложения","cron"],
    a:1,
    e:"Рекомендуется <code>lifespan</code> — async context manager: код до <code>yield</code> исполняется при старте, после — при остановке. Старые <code>@app.on_event('startup'/'shutdown')</code> считаются устаревшими."
  },
  {
    t:"Документация",
    q:"Что автоматически генерирует FastAPI из типов и моделей?",
    o:["Только README","Схему OpenAPI и интерактивные доки Swagger UI (/docs) и ReDoc (/redoc)","PDF-отчёт","Тесты"],
    a:1,
    e:"На основе аннотаций и Pydantic-моделей FastAPI строит спецификацию OpenAPI (<code>/openapi.json</code>) и отдаёт интерактивные <code>/docs</code> (Swagger UI) и <code>/redoc</code>."
  },
  {
    t:"Безопасность",
    q:"Какой стандарт обычно используют для аутентификации через токены в FastAPI?",
    o:["Basic Auth только","OAuth2 с Bearer-токеном (часто JWT), через OAuth2PasswordBearer","API отключает безопасность","Cookie обязательны"],
    a:1,
    e:"FastAPI даёт готовые классы: <code>OAuth2PasswordBearer</code> извлекает Bearer-токен из заголовка <code>Authorization</code>. Часто токен — это JWT, который валидируется в зависимости и даёт текущего пользователя."
  },
  {
    t:"Безопасность",
    q:"Как правильно хранить пароли пользователей?",
    o:["В открытом виде","В зашифрованном виде с возможностью расшифровки","Хешировать (напр. bcrypt через passlib), сравнивать хеши","В query-параметре"],
    a:2,
    e:"Пароли не шифруют, а <b>хешируют</b> с солью (bcrypt/argon2, например через <code>passlib</code>). При входе сравнивают хеш введённого пароля с сохранённым. Расшифровка невозможна и не нужна."
  },
  {
    t:"Безопасность",
    q:"Где принято передавать JWT при запросах к защищённому API?",
    o:["В query-параметре ?token=","В заголовке Authorization: Bearer <token>","В URL-пути","В теле каждого GET"],
    a:1,
    e:"Стандарт — заголовок <code>Authorization: Bearer &lt;token&gt;</code>. Query-параметр небезопасен: токен попадает в логи и историю. FastAPI's <code>OAuth2PasswordBearer</code> читает именно этот заголовок."
  },
  {
    t:"Тестирование",
    q:"Какой класс используют для тестирования эндпоинтов FastAPI?",
    o:["unittest.mock только","TestClient (на базе httpx/requests)","selenium","curl обязательно"],
    a:1,
    e:"<code>from fastapi.testclient import TestClient; client = TestClient(app)</code> позволяет вызывать эндпоинты в тестах: <code>client.get('/')</code>. Под капотом — httpx, запросы идут без реального сетевого сервера."
  },
  {
    t:"Pydantic v2",
    q:"Как в Pydantic v2 получить dict из модели (замена .dict())?",
    o:[".to_json()",".model_dump()",".serialize()",".as_dict()"],
    a:1,

const app = document.getElementById('app');
const prog = document.getElementById('prog');
const counter = document.getElementById('counter');
const live = document.getElementById('live');
const total = QUESTIONS.length;
let idx = 0, score = 0, answered = false;
const KEYS = ['A','B','C','D','E','F'];

function render(){
  const item = QUESTIONS[idx];
  answered = false;
  counter.textContent = `Вопрос ${idx+1} из ${total}`;
  live.textContent = `Верно: ${score}`;
  prog.style.width = ((idx)/total*100) + '%';

  let html = `<div class="tag">${item.t}</div>`;
  html += `<p class="q">${item.q}</p>`;
  html += `<div class="opts">`;
  item.o.forEach((opt,i)=>{
    html += `<button class="opt" data-i="${i}"><span class="k">${KEYS[i]}</span><span>${opt}</span></button>`;
  });
  html += `</div>`;
  html += `<div class="expl" id="expl"></div>`;
  html += `<div class="row">
      <span class="score">Прогресс: ${idx+1}/${total}</span>
      <button class="nav" id="next" disabled>${idx+1===total?'Результат':'Далее →'}</button>
    </div>`;
  app.innerHTML = html;

  app.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>choose(parseInt(btn.dataset.i)));
  });
  document.getElementById('next').addEventListener('click', next);
}

function choose(i){
  if(answered) return;
  answered = true;
  const item = QUESTIONS[idx];
  const opts = app.querySelectorAll('.opt');
  opts.forEach(o=>o.setAttribute('disabled','true'));
  const correct = item.a;
  opts[correct].classList.add('correct');
  const ok = i === correct;
  if(ok){ score++; }
  else { opts[i].classList.add('wrong'); }
  live.textContent = `Верно: ${score}`;

  const expl = document.getElementById('expl');
  expl.innerHTML = `<div class="verdict ${ok?'ok':'bad'}">${ok?'✓ Верно':'✗ Неверно'} — правильный ответ: ${KEYS[correct]}</div>
    <h4>Пояснение</h4><div>${item.e}</div>`;
  expl.classList.add('show');
  document.getElementById('next').disabled = false;
  prog.style.width = ((idx+1)/total*100) + '%';
}

function next(){
  if(idx+1 === total){ result(); return; }
  idx++;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function grade(pct){
  if(pct>=90) return ['Отлично — уровень Senior', '#2ecc71'];
  if(pct>=75) return ['Хорошо — крепкий Middle', '#4f8cff'];
  if(pct>=55) return ['Неплохо — Junior+, есть куда расти', '#f1c40f'];
  return ['Стоит подтянуть основы', '#ff5468'];
}

function result(){
  const pct = Math.round(score/total*100);
  const [label,color] = grade(pct);
  prog.style.width = '100%';
  counter.textContent = 'Завершено';
  live.textContent = `Верно: ${score}/${total}`;
  app.innerHTML = `<div class="result">
      <div class="lbl">Ваш результат</div>
      <div class="big" style="color:${color}">${score} / ${total}</div>
      <div class="lbl">${pct}% правильных</div>
      <div class="grade" style="color:${color}">${label}</div>
      <div class="row" style="justify-content:center">
        <button class="nav" id="restart">Пройти заново</button>
      </div>
    </div>`;
  document.getElementById('restart').addEventListener('click', ()=>{
    idx=0; score=0; render(); window.scrollTo({top:0});
  });
}

render();
</script>
